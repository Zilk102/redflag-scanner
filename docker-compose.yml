services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - app

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-yookassa}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN:-}
      PAYMENT_WEBHOOK_ALLOWED_CIDRS: ${PAYMENT_WEBHOOK_ALLOWED_CIDRS:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_BASE_URL: ${YOOKASSA_BASE_URL:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD_1: ${ROBOKASSA_PASSWORD_1:-}
      ROBOKASSA_PASSWORD_2: ${ROBOKASSA_PASSWORD_2:-}
      ROBOKASSA_TEST_MODE: ${ROBOKASSA_TEST_MODE:-}
      ROBOKASSA_BASE_URL: ${ROBOKASSA_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - server
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${CLIENT_DIST_PATH:-./client/dist}:/usr/share/nginx/html:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    restart: always
    networks:
      - app

volumes:
  db_data:

networks:
  app:
    driver: bridge

