worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Блок 1: Редирект с HTTP на HTTPS
  server {
    listen 80;
    server_name toxiscan.ru;
    return 301 https://$host$request_uri;
  }

  # Блок 2: Основной сайт (HTTPS)
  server {
    listen 443 ssl;
    server_name toxiscan.ru;

    # Сертификаты (они проброшены через docker-compose)
    ssl_certificate /etc/letsencrypt/live/toxiscan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toxiscan.ru/privkey.pem;

    client_max_body_size 10m;

    location /api/ {
      proxy_pass http://server:5000;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location = /privacy.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location = /offer.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}