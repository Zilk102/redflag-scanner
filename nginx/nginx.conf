worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_http_version 1.1;
  gzip_disable "msie6";
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Блок 1: Редирект с HTTP на HTTPS
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Блок 2: Основной сайт (HTTPS)
  server {
    listen 443 ssl default_server;
    server_name _;

    # Сертификаты (они проброшены через docker-compose)
    ssl_certificate /etc/letsencrypt/live/toxiscan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toxiscan.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location = /lp/ {
      return 301 /lp;
    }

    location = /lp {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=600" always;
      try_files /lp/index.html =404;
    }

    location ~* ^(/lp/[^/]+)/+$ {
      return 301 $1;
    }

    location ~* ^(/lp/.+)\.html$ {
      return 301 $1;
    }

    location /api/ {
      proxy_pass http://server:5000;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location = /robots.txt {
      proxy_pass http://server:5000/robots.txt;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location = /sitemap.xml {
      proxy_pass http://server:5000/sitemap.xml;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /r/ {
      proxy_pass http://server:5000;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ^~ /lp/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=600" always;
      index index.html;
      try_files $uri $uri.html $uri/ =404;
    }

    location = /privacy.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location = /offer.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
